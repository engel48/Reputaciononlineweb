org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# Caché incremental de Kotlin desactivada: el proyecto en Z: y el pub-cache en C:
# (cross-drive) corrompe los .tab y llena la consola de stacktraces. Sin esto el
# build cae igual a no-incremental, pero sin el spam de errores.
kotlin.incremental=false
